name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Build Next.js App for Mobile
        run: IS_CAPACITOR=true npm run build

      - name: Setup Capacitor & Splash Screen Plugin
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/splash-screen@6 --save
          rm -rf android
          npx cap add android

      - name: Generate App Icons and Splash Screens
        run: |
          python3 -c '
          import os, shutil

          candidates = [
              "public/android-chrome-512x512.png",
              "public/icon-512x512.png",
              "public/apple-touch-icon.png",
              "public/favicon.png",
              "public/favicon-32x32.png"
          ]
          src = None
          for c in candidates:
              if os.path.exists(c):
                  src = c
                  break

          if src:
              print(f"Using source graphic: {src}")
              res_dir = "android/app/src/main/res"

              # 1. Launcher icons replace karein
              for root, dirs, files in os.walk(res_dir):
                  for f in files:
                      if "ic_launcher" in f and f.endswith(".png"):
                          shutil.copyfile(src, os.path.join(root, f))

              # 2. Splash screen drawables generate karein
              splash_dirs = [
                  "drawable",
                  "drawable-land-mdpi", "drawable-land-hdpi", "drawable-land-xhdpi", "drawable-land-xxhdpi", "drawable-land-xxxhdpi",
                  "drawable-port-mdpi", "drawable-port-hdpi", "drawable-port-xhdpi", "drawable-port-xxhdpi", "drawable-port-xxxhdpi"
              ]
              for s_dir in splash_dirs:
                  target_folder = os.path.join(res_dir, s_dir)
                  os.makedirs(target_folder, exist_ok=True)
                  shutil.copyfile(src, os.path.join(target_folder, "splash.png"))
              print("Splash screen assets generated.")
          '
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalcPro-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
