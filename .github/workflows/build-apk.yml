name: Build and Auto-Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read Version & Details from version.json
        id: ver
        run: |
          python3 -c '
          import json, os

          filepath = "public/version.json"
          if os.path.exists(filepath):
              with open(filepath, "r") as f:
                  data = json.load(f)
              v = data.get("version", "1.0.1").strip()
              w = data.get("whatsNew", "New updates and fixes.").strip()
          else:
              v = "1.0.1"
              w = "New release build."

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={v}\n")
              out.write(f"tag=v{v}\n")
              out.write(f"notes={w}\n")
          print(f"Target Release Version: {v}")
          '

      - name: Install Project Dependencies
        run: npm install

      - name: Build Next.js App for Mobile
        run: IS_CAPACITOR=true npm run build

      - name: Setup Capacitor Platform
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/splash-screen@6 --save
          rm -rf android
          npx cap add android

      - name: Inject Custom App Icons
        run: |
          python3 -c '
          import os, shutil

          candidates = [
              "public/android-chrome-512x512.png",
              "public/icon-512x512.png",
              "public/apple-touch-icon.png",
              "public/favicon.png",
              "public/favicon-32x32.png"
          ]
          src = None
          for c in candidates:
              if os.path.exists(c):
                  src = c
                  break

          if src:
              res_dir = "android/app/src/main/res"
              for root, dirs, files in os.walk(res_dir):
                  for f in files:
                      if "ic_launcher" in f and f.endswith(".png"):
                          shutil.copyfile(src, os.path.join(root, f))
          '
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Auto Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: CalcPro ${{ steps.ver.outputs.tag }}
          body: ${{ steps.ver.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
