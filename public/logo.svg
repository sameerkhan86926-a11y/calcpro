<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonSlash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="28" fill="url(#cyberBg)"/>
  <rect x="1" y="1" width="118" height="118" rx="27" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Vault Shackle / Math Ring -->
  <path d="M 40 52 C 40 40, 50 30, 60 30 C 70 30, 80 40, 80 52" 
        fill="none" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>

  <!-- Dynamic Slash Matrix (/ and %) -->
  <line x1="78" y1="38" x2="42" y2="82" stroke="url(#neonSlash)" stroke-width="8" stroke-linecap="round"/>

  <!-- Top-Right & Bottom-Left Precision Nodes -->
  <circle cx="46" cy="46" r="6" fill="#38bdf8"/>
  <circle cx="74" cy="74" r="6" fill="#a855f7"/>

  <!-- Center Vault Node -->
  <circle cx="60" cy="60" r="3" fill="#ffffff"/>
</svg>
