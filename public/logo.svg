<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="prismGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="vaultLock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Icon Container -->
  <rect width="120" height="120" rx="28" fill="#090d16"/>
  <rect width="120" height="120" rx="28" fill="url(#prismGlow)" opacity="0.45"/>
  <rect x="1" y="1" width="118" height="118" rx="27" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Futuristic Geometric 'C' + Vault Shield Arc -->
  <path d="M 78 30 
           C 52 22, 28 36, 28 60 
           C 28 84, 52 98, 78 90
           L 84 76
           C 66 82, 45 74, 45 60
           C 45 46, 66 38, 84 44 Z" 
        fill="url(#neonCyan)" filter="url(#glow)"/>

  <!-- Stealth Math / Vault Core (Minus & Equal embedded in negative space) -->
  <rect x="56" y="52" width="28" height="5" rx="2.5" fill="url(#vaultLock)"/>
  <rect x="56" y="63" width="28" height="5" rx="2.5" fill="url(#vaultLock)"/>

  <!-- Subtle Cyber Security Dot (Vault Indicator) -->
  <circle cx="86" cy="30" r="3.5" fill="#38bdf8"/>
</svg>
